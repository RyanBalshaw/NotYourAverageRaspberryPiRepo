<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-refreshing Strava Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        .image-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }
    </style>
    <script>
        function refreshImage() {
            var img = document.getElementById('figure');
            var src = img.src;
            var pos = src.indexOf('?');
            if (pos >= 0) {
                src = src.substr(0, pos);
            }
            img.src = src + '?v=' + new Date().getTime();
        }

        window.onload = function() {
            setInterval(refreshImage, 60000); // Refresh every 60 seconds
        }
    </script>
</head>
<body>
    <div class="image-container">
        <img id="figure" src="IMAGE_PATH_PLACEHOLDER" alt="Strava Plot">
    </div>
</body>
</html>
